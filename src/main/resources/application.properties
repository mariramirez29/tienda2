spring.application.name=tienda

# Puerto por donde escucha nuestro servidor web
server.port=8080

# Formato de la hora en los logs
logging.pattern.dateformat=hh:mm

# Evitamos la salida del banner de Spring
spring.main.banner-mode=off

# Desactivamos el cache de Thymeleaf en desarrollo
spring.thymeleaf.cache=false

# ======================================
# Conexión local a la BD techshop en MySQL
# ======================================
#spring.datasource.url=jdbc:mysql://localhost:3306/techshop

# ======================================
# Conexión remota en Aiven a la BD techshop en MySQL
# ======================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Driver y Plataforma de comunicación
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Mostrar SQL en consola
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace

# ==========================
# Firebase Storage
# ==========================
firebase.bucket.name=techshop-f986c.firebasestorage.app
firebase.storage.path=techshop
firebase.json.path=firebase
firebase.json.file=techshop-f986c-firebase-adminsdk-fbsvc-7cb3a30d0a.json