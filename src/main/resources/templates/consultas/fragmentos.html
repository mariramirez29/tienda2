<!-- Fragmento #1 para presentar las categorías en tabs -->
<section th:fragment="tabs" class="py-3 mb-3">

    <div class="d-flex justify-content-center px-5">

        <ul class="nav nav-underline">

            <li class="nav-item">
                <a class="nav-link"
                   aria-current="page"
                   th:href="@{/}">
                    [[#{pruebas.todas}]]
                </a>
            </li>

            <li th:each="c : ${categorias}"
                class="nav-item">

                <a class="nav-link"
                   th:href="@{/consultas/{id}(id=${c.idCategoria})}">
                    [[${c.descripcion}]]
                </a>

            </li>

        </ul>

    </div>

</section>


<!-- Fragmento #2 para el listado de tarjetas de productos -->
<section th:fragment="tarjetas" class="container py-5">

    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-xl-4 g-4">

        <div th:each="p : ${productos}" class="col">

            <div class="card h-100 shadow-sm">

                <div class="card-body d-flex justify-content-center align-items-center bg-light p-3"
                     style="height: 200px">

                    <img th:src="${p.rutaImagen}"
                         th:alt="${p.descripcion}"
                         class="img-fluid"
                         style="max-height: 100%; object-fit: contain"/>

                </div>

                <div class="card-header bg-white">

                    <h5 class="card-title text-center text-truncate mb-0">
                        [[${p.descripcion}]]
                    </h5>

                </div>

                <div class="card-body d-flex flex-column">

                    <p class="card-text text-muted mb-auto text-truncate">
                        [[${p.detalle}]]
                    </p>

                </div>

                <div class="card-footer bg-white d-flex justify-content-between align-items-center">

                    <div class="fw-bold">

                        <span class="text-success h5">
                            [[${#numbers.formatCurrency(p.precio)}]]
                        </span>

                        <span th:if="${p.existencias > 0}"
                              class="badge text-bg-success ms-2">
                            [[${p.existencias}]]
                        </span>

                        <span th:if="${p.existencias == 0}"
                              class="badge text-bg-danger">
                            Agotado
                        </span>

                    </div>

                    <form action="/carrito/agregar"
                          th:method="post"
                          class="d-inline">

                        <input type="hidden"
                               th:value="${p.idProducto}"
                               name="idProducto"/>

                        <button type="button"
                                class="btn btn-primary"
                                th:disabled="${p.existencias == 0}"
                                onclick="addCart(this.form)">
                            <i class="fas fa-cart-plus"></i>
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</section>
